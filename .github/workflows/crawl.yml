name: Geocache Crawler

on:
  # 定时触发：每天 UTC 20:00 运行（北京时间次日 04:00）；
  # 每月 1 日 UTC 22:00 重爬无 last found 或一个月以上没有新 Found 的活跃缓存日志。
  schedule:
    - cron: '0 20 * * *'
    - cron: '0 22 1 * *'
  
  # 手动触发
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'both'
        type: choice
        options:
          - caches
          - logs
          - logs-full
          - logs-missing-id
          - logs-radius
          - both
          - generate
          - diagnose-auth

concurrency:
  group: geocache-crawler-${{ github.ref }}
  cancel-in-progress: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  REG_COOKIE: ${{ secrets.REG_COOKIE }}
  GEOCOOKIE_NONPREMIUM: ${{ secrets.GEOCOOKIE_NONPREMIUM }}
  GEOCOOKIE_PREMIUM: ${{ secrets.GEOCOOKIE_PREMIUM }}
  GEOCACHING_COOKIE_STATE_FILE: .runtime/geocaching-auth/nonpremium.enc

jobs:
  diagnose-auth:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'diagnose-auth'
    timeout-minutes: 10
    env:
      GEOCACHING_COOKIE_STATE_KEY: ${{ secrets.GEOCACHING_COOKIE_STATE_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Restore encrypted nonpremium cookie state
        if: env.GEOCACHING_COOKIE_STATE_KEY != ''
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: .runtime/geocaching-auth/nonpremium.enc
          key: geocaching-basic-state-v1-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          restore-keys: geocaching-basic-state-v1-

      - name: Install diagnostic dependencies
        run: pip install 'requests>=2.31.0' 'cryptography>=44.0.0'

      - name: Compare cookie jar and legacy header authentication
        run: python diagnose_auth.py --use-cookie-state --compare-legacy --compare-full-cookie

      - name: Save encrypted nonpremium cookie state
        if: always() && env.GEOCACHING_COOKIE_STATE_KEY != '' && hashFiles('.runtime/geocaching-auth/nonpremium.enc') != ''
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: .runtime/geocaching-auth/nonpremium.enc
          key: geocaching-basic-state-v1-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

  crawl-caches:
    runs-on: ubuntu-latest
    if: github.event.inputs.mode == 'caches' || github.event.inputs.mode == 'both' || github.event_name == 'schedule'
    env:
      GEOCACHING_COOKIE_STATE_KEY: ${{ secrets.GEOCACHING_COOKIE_STATE_KEY }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore encrypted nonpremium cookie state
        if: env.GEOCACHING_COOKIE_STATE_KEY != ''
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: .runtime/geocaching-auth/nonpremium.enc
          key: geocaching-basic-state-v1-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          restore-keys: geocaching-basic-state-v1-

      - name: Run cache crawler
        run: python crawl_caches.py
        timeout-minutes: 360
        env:
          LOG_TO_FILE: '1'

      - name: Assign cache cities
        run: python assign_cities.py
        timeout-minutes: 60
        env:
          LOG_TO_FILE: '1'

      - name: Save encrypted nonpremium cookie state
        if: always() && env.GEOCACHING_COOKIE_STATE_KEY != '' && hashFiles('.runtime/geocaching-auth/nonpremium.enc') != ''
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: .runtime/geocaching-auth/nonpremium.enc
          key: geocaching-basic-state-v1-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-caches-logs
          path: crawl_caches.log

  crawl-logs:
    runs-on: ubuntu-latest
    needs: crawl-caches
    if: always() && (github.event.inputs.mode == 'logs' || github.event.inputs.mode == 'logs-full' || github.event.inputs.mode == 'logs-missing-id' || github.event.inputs.mode == 'logs-radius' || github.event.inputs.mode == 'both' || github.event_name == 'schedule')
    env:
      GEOCACHING_COOKIE_STATE_KEY: ${{ secrets.GEOCACHING_COOKIE_STATE_KEY }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore encrypted nonpremium cookie state
        if: env.GEOCACHING_COOKIE_STATE_KEY != ''
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: .runtime/geocaching-auth/nonpremium.enc
          key: geocaching-basic-state-v1-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          restore-keys: geocaching-basic-state-v1-
      
      - name: Run logs crawler
        run: |
          if [ "$RUN_MODE" = "logs-full" ]; then
            python crawl_logs.py --full
          elif [ "$RUN_MODE" = "logs-missing-id" ]; then
            python crawl_logs.py --missing-log-id
          elif [ "$RUN_MODE" = "logs-radius" ]; then
            python crawl_logs.py --center-lat 39.9446166667 --center-lng 116.4753 --radius-km 2
          elif [ "$SCHEDULE" = "0 22 1 * *" ]; then
            python crawl_logs.py --full-active
          else
            python crawl_logs.py
          fi
        timeout-minutes: 360
        env:
          LOG_TO_FILE: '1'
          RUN_MODE: ${{ github.event.inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}

      - name: Save encrypted nonpremium cookie state
        if: always() && env.GEOCACHING_COOKIE_STATE_KEY != '' && hashFiles('.runtime/geocaching-auth/nonpremium.enc') != ''
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: .runtime/geocaching-auth/nonpremium.enc
          key: geocaching-basic-state-v1-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-logs-logs
          path: crawl_logs.log

  generate-data:
    runs-on: ubuntu-latest
    needs: crawl-logs
    if: always() && (github.event.inputs.mode == 'both' || github.event.inputs.mode == 'logs-full' || github.event.inputs.mode == 'generate' || github.event_name == 'schedule')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Crawl missing user registration dates
        if: github.event.inputs.mode == 'both' || github.event.inputs.mode == 'logs-full' || github.event.inputs.mode == 'generate' || github.event_name == 'schedule'
        run: python crawl_user_regdates.py
        timeout-minutes: 360
        env:
          LOG_TO_FILE: '1'

      - name: Generate static data files
        run: python generate_data.py
        timeout-minutes: 30
        env:
          LOG_TO_FILE: '1'

      - name: Setup SSH deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GEODATAING_DEPLOY_KEY }}" > ~/.ssh/geodataing_deploy
          chmod 600 ~/.ssh/geodataing_deploy
          cat >> ~/.ssh/config << 'EOF'
          Host github.com
            IdentityFile ~/.ssh/geodataing_deploy
            StrictHostKeyChecking no
          EOF

      - name: Push to Geodataing repository
        run: |
          git clone git@github.com:EPoNeNT/Geodataing.git /tmp/Geodataing
          mkdir -p /tmp/Geodataing/public/data
          cp public/data/*.json /tmp/Geodataing/public/data/
          cd /tmp/Geodataing
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "auto-update: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push origin master
            echo "Pushed to Geodataing successfully"
          else
            echo "No changes to push"
          fi

      - name: Upload generated data
        uses: actions/upload-artifact@v4
        with:
          name: generated-data
          path: public/data/

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generate-data-logs
          path: |
            crawl_user_regdates.log
            generate_data.log

name: Notify Series Requests

on:
  schedule:
    - cron: "0 */4 * * *"  # 每4小时整点
  workflow_dispatch:
    inputs:
      request_id:
        description: '审核完成后需发送邮件的申请 ID；留空则发送管理员待处理通知'
        required: false
        type: string

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install psycopg2-binary python-dotenv requests

      - name: Notify
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NOTIFY_SENDER: ${{ secrets.NOTIFY_SENDER }}
          NOTIFY_PASSWORD: ${{ secrets.NOTIFY_PASSWORD }}
          NOTIFY_RECEIVER: ${{ secrets.NOTIFY_RECEIVER }}
        run: |
          if [ -n "${{ inputs.request_id }}" ]; then
            python notify_series_requests.py --decision-request-id "${{ inputs.request_id }}"
          else
            python notify_series_requests.py
          fi
